<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found | WEST THEORY</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px),
        #080808;
      background-size: 45px 45px;
      color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .error {
      max-width: 800px;
    }

    .code {
      color: #555;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 5px;
    }

    h1 {
      margin-top: 18px;
      font-family: "Barlow Condensed", Arial, sans-serif;
      font-size: clamp(70px, 12vw, 150px);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 2px;
    }

    p {
      margin: 30px auto 0;
      max-width: 520px;
      color: #888;
      font-size: 14px;
      line-height: 1.8;
    }

    a {
      display: inline-block;
      margin-top: 38px;
      padding: 15px 24px;
      border: 1px solid rgba(255,255,255,0.7);
      color: #fff;
      text-decoration: none;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      transition: 0.2s ease;
    }

    a:hover {
      background: #fff;
      color: #080808;
    }
  </style>
</head>

<body>

  <main class="error">

    <div class="code">
      WEST THEORY / 404
    </div>

    <h1>
      TRACK<br>NOT FOUND.
    </h1>

    <p>
      This page doesn't exist in the WEST THEORY catalogue.
    </p>

    <a href="/">
      RETURN TO WEST THEORY
    </a>

  </main>

</body>
</html>
